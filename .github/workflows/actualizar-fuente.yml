name: Actualizar fuente

# Cada vez que publicas, editas o borras una Release, pone fuente.json al
# día. SideStore lo ve y avisa a todos de la actualización. Si la versión
# de dentro del .ipa no coincide con la etiqueta, no la añade y sale en rojo.
on:
  release:
    types: [published, edited, deleted]

permissions:
  contents: write

# Al publicar, GitHub a veces lanza el proceso dos veces seguidas: así se
# ejecutan de una en una y la segunda ve que ya está hecho.
concurrency:
  group: actualizar-fuente
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Poner fuente.json al día
        id: fuente
        run: python3 .github/scripts/actualizar_fuente.py

      - name: Guardar el cambio
        run: |
          if git diff --quiet; then
            echo "fuente.json ya estaba al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuente.json
          git commit -m "Fuente: ${{ github.event.action }} ${{ github.event.release.tag_name }}"
          git pull --rebase origin main
          git push

      - name: Avisar si el .ipa no es la versión de la etiqueta
        if: steps.fuente.outputs.error == 'si'
        run: |
          echo "La versión de dentro del .ipa no coincide con la etiqueta de la Release. Mira el resumen de esta ejecución."
          exit 1
