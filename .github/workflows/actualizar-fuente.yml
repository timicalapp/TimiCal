name: Actualizar fuente

# Cada vez que publicas una Release con un .ipa, añade esa versión a
# fuente.json. SideStore lo ve y avisa a todos de la actualización.
on:
  release:
    types: [published, edited]

permissions:
  contents: write

# Al publicar, GitHub a veces lanza el proceso dos veces seguidas: así se
# ejecutan de una en una y la segunda ve que ya está hecho.
concurrency:
  group: actualizar-fuente
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Añadir la versión a fuente.json
        run: python3 .github/scripts/actualizar_fuente.py

      - name: Guardar el cambio
        run: |
          if git diff --quiet; then
            echo "fuente.json ya estaba al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuente.json
          git commit -m "Fuente: versión ${{ github.event.release.tag_name }}"
          git pull --rebase origin main
          git push
